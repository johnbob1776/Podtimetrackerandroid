name: Build Compact Pod Tracker APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -oq pod-tracker-source-full.zip -d .
      - name: Compact the widget
        run: |
          sed -i 's/290dp/195dp/; s/targetCellHeight="4"/targetCellHeight="2"/; s/android:resizeMode=/android:minResizeHeight="195dp" android:resizeMode=/' app/src/main/res/xml/pod_widget_info.xml
          sed -i 's/11dp/6dp/; s/34dp/22dp/; s/32dp/22dp/' app/src/main/res/layout/pod_widget.xml
          sed -i 's/46dp/33dp/g; s/4dp/2dp/g; s/32dp/28dp/g; s/20sp/17sp/g' app/src/main/res/values/styles.xml
          sed -i "s/versionCode 1/versionCode 2/; s/versionName '1.0'/versionName '1.1-compact'/" app/build.gradle
          python3 verify_project.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PodTimeTracker-Compact-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
